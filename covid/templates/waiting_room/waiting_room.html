{% extends "base.html" %}

{% block content %}

<h1>{{ clinic.clinic_name }}</h1>

<h2>Waiting Room</h2>

<p>
    Now serving:
    <strong>#{{ waiting_room.current_queue }}</strong>
</p>

<p>
    People waiting:
    <strong>{{ waiting_room.number_of_people }}</strong>
</p>

<p>
    Estimated waiting time:
    <strong>{{ estimated_wait }} minutes</strong>
</p>

<a class="button"
   href="{{ url_for(
       'waiting_room_bp.join_waiting_room',
       clinic_id=clinic.clinic_id
   ) }}">
    Join Queue
</a>

{% endblock %}
