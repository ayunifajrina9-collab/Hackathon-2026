<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Medical Waiting Room{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
        }

        h1, h2 {
            color: #333;
        }

        .button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{{ url_for('home_bp.home') }}">Home</a>
        {% if session.get('patient_id') and session.get('clinic_id') %}
        <a href="{{ url_for( 'waiting_room_bp.patient_status', clinic_id=session.get('clinic_id') ) }}">
            My Waiting Status </a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
