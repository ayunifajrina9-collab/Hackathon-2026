{% extends "base.html" %}

{% block content %}

<h1>Hospital</h1>

<p>Please choose a clinic:</p>

{% for clinic in clinics %}

    <div>
        <a class="button"
           href="{{ url_for(
               'waiting_room_bp.waiting_room',
               clinic_id=clinic.clinic_id
           ) }}">
            {{ clinic.clinic_name }}
        </a>
    </div>

{% endfor %}

{% endblock %}
